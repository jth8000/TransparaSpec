version: 2

# One grouped PR per ecosystem per week for minor and patch updates, so
# updates stay reviewable. Major updates open their own PRs, except for
# GitHub Actions (grouped: CI exercises them directly). Packages Expo pins
# aren't updated here at all (see the npm ignores).
#
# Security updates (a separate repo setting) open their own PRs as soon as
# an advisory lands, but they honor these ignores too. Advisories in
# Expo-pinned packages still surface in Dependabot alerts and fail the npm
# audit check (`make security`).
updates:
  - package-ecosystem: mix
    directory: /apps/server
    schedule:
      interval: weekly
    groups:
      mix:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Expo pins these to exact versions or narrow ranges for each SDK
      # (`make expo-check`). Dependabot doesn't know the pins: it proposed
      # react 19.3.1 and react-native-gesture-handler 3.4.0 against SDK
      # 58's 19.3.0 and ~3.3.0. So it leaves them alone, and `make expo-fix`
      # (`npx expo install --fix`) moves them together.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "jest-expo"
      # The toolchain the SDK is tested with isn't pinned, but its majors
      # wait for an Expo SDK upgrade too (ESLint 10 breaks `expo lint`).
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "jest"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [major, minor, patch]
