version: 2

# One grouped PR per ecosystem per week for minor and patch updates, so
# updates stay reviewable. Major updates open their own PRs, except for
# GitHub Actions (grouped: CI exercises them directly) and the packages an
# Expo SDK upgrade owns (ignored below). Security updates (a separate repo
# setting) still open their own PRs as soon as an advisory lands.
updates:
  - package-ecosystem: mix
    directory: /apps/server
    schedule:
      interval: weekly
    groups:
      mix:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # These majors move together in an Expo SDK upgrade
      # (`npx expo install --fix`), never one package at a time. That
      # includes the toolchain the SDK is tested with: TypeScript, ESLint
      # (eslint-config-expo) and Jest (jest-expo).
      - dependency-name: "expo"
        update-types: [version-update:semver-major]
      - dependency-name: "expo-*"
        update-types: [version-update:semver-major]
      - dependency-name: "@expo/*"
        update-types: [version-update:semver-major]
      - dependency-name: "react"
        update-types: [version-update:semver-major]
      - dependency-name: "react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: "react-native"
        update-types: [version-update:semver-major]
      - dependency-name: "react-native-*"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "eslint-config-expo"
        update-types: [version-update:semver-major]
      - dependency-name: "jest"
        update-types: [version-update:semver-major]
      - dependency-name: "jest-expo"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [major, minor, patch]
