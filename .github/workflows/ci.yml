name: CI

on:
  push:
  pull_request:

env:
  # The Postgres service listens on the default port in CI.
  DB_PORT: "5432"

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Install ffmpeg (LocalProvider pipeline test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            apps/server/deps
            apps/server/_build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'apps/server/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/client
      - run: npm run lint -w apps/client
      - run: npm test -w apps/client

  api-schema:
    # The committed OpenAPI spec and generated TS client must match the server.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cd apps/server && mix deps.get
      - run: make api-check

  e2e:
    # Web end-to-end: Playwright starts Phoenix (LocalProvider + ffmpeg) and Expo web.
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: cd apps/server && mix setup
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test -w e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
